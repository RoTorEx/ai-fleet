<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Fleet · App prototype</title>
<style>
  :root {
    color-scheme: dark;
    --desk: #14171c; --bar: #1b2027; --window: #24262b; --surface: #2c2f36;
    --control: #383c45; --line: #454a55; --grid: #3a404a; --text: #f2f4f8;
    --muted: #b0b8c6; --accent: #91b8ff; --selected: #263e64; --green: #69dca4;
    --amber: #ffd07d; --coral: #ff986f; --red: #ff9b9d; --input: #87afff; --cache: #f2b75a;
    --output: #65dbb2; --plot: #21252d; --scrim: rgb(8 11 19 / .66);
    --shadow: 0 18px 55px rgb(0 0 0 / .32);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --desk: #e3e8f0; --bar: #f7f9fc; --window: #f7f8fa; --surface: #fff;
    --control: #e9edf4; --line: #c9d0dd; --grid: #dde3ea; --text: #192231;
    --muted: #505c70; --accent: #134f9d; --selected: #d9e8ff; --green: #146748;
    --amber: #8a4b10; --coral: #a6452e; --red: #a52c35; --input: #276bc4; --cache: #bc690d;
    --output: #168362; --plot: #f5f7fa; --scrim: rgb(42 57 75 / .38);
    --shadow: 0 18px 55px rgb(35 44 64 / .16);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--desk); color: var(--text); }
  button, input, select { font: inherit; color: inherit; }
  button, select {
    border: 1px solid var(--line); border-radius: 7px; background: var(--control);
    padding: 5px 10px; cursor: pointer; min-height: 30px;
  }
  button:hover, select:hover { border-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[aria-pressed="true"], .primary { background: var(--selected); color: var(--accent); border-color: var(--accent); }
  .ghost { background: transparent; border-color: transparent; }
  .danger { color: var(--red); }
  [hidden] { display: none !important; }
  input[type="text"], input[type="email"], input[type="password"] {
    width: 100%; border: 1px solid var(--line); border-radius: 7px;
    background: var(--surface); padding: 7px 9px;
  }
  p { margin: .25em 0 .7em; }
  h1, h2, h3 { margin: 0; line-height: 1.25; }
  h1 { font-size: 17px; }
  h2 { font-size: 15px; }
  h3 { font-size: 13px; }
  .muted, small { color: var(--muted); }
  .mono, time, td:last-child { font-variant-numeric: tabular-nums; }
  .toolbar, .row, .window-head, .tab-strip, .chart-head, .sheet-footer {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .spread, .window-head, .chart-head { justify-content: space-between; }
  .review {
    padding: 12px clamp(12px, 4vw, 48px); background: var(--bar); border-bottom: 1px solid var(--line);
    position: relative; z-index: 3;
  }
  .review label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .review .toolbar { gap: 10px 15px; }
  .review-copy { margin-right: auto; }
  .review-copy strong { display: block; }
  .review-copy small { display: block; }
  .desktop { max-width: 1120px; margin: auto; padding: 18px clamp(10px, 3vw, 30px) 34px; }
  .desktop-bar { display: flex; justify-content: flex-end; margin-bottom: 10px; }
  .desktop-bar button { display: flex; align-items: center; gap: 7px; }
  .stage { display: flex; justify-content: center; }
  .window {
    max-width: 100%; min-width: 0; width: 900px; background: var(--window);
    border: 1px solid var(--line); border-radius: 13px; box-shadow: var(--shadow);
  }
  .menu-window { width: 380px; }
  .quota-window { width: 630px; }
  .settings-window { width: 740px; }
  .logs-window { width: 720px; }
  .notification-window { width: 600px; }
  .window-head { padding: 12px 15px; border-bottom: 1px solid var(--line); }
  .window-head h1 { flex: 1; }
  .window-body { padding: 13px 15px 15px; min-width: 0; }
  .menu-window .window-body { padding: 9px; }
  .tab-strip { gap: 4px; margin-bottom: 10px; }
  .tab-strip button { font-weight: 600; }
  .menu-window .tab-strip button { flex: 1; padding-inline: 5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--green); }
  .warn .dot, .dot.warn { background: var(--amber); }
  .danger .dot, .dot.danger { background: var(--red); }
  .panel, .provider-row, .process-row, .agent-row, .account, .notice {
    background: var(--surface); border: 1px solid var(--line); border-radius: 9px;
  }
  .panel, .account, .notice { padding: 12px; }
  .notice { margin: 8px 0; border-left: 3px solid var(--amber); }
  .agent-row, .process-row { padding: 8px 9px; }
  .stack { display: grid; gap: 8px; }
  .provider-list { padding-inline: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; }
  .provider-row { border: 0; border-radius: 0; padding: 4px 0 5px; }
  .provider-row + .provider-row { border-top: 1px solid var(--line); }
  .provider-row .row strong { flex: 1; }
  .provider-row p { margin: 0; }
  .provider-row .icon { min-height: 25px; }
  .quota-line { display: grid; grid-template-columns: 1fr 5em minmax(8em, auto); gap: 7px; color: var(--muted); font-size: 13px; }
  .quota-line strong { color: var(--text); text-align: right; }
  .agent-filters button { flex: 0 0 auto; padding-inline: 6px; white-space: nowrap; font-size: 13px; }
  .process-row .row { gap: 4px; }
  .process-row button { padding-inline: 7px; font-size: 13px; }
  .foot { margin-top: 9px; padding: 4px 3px 0; font-size: 12px; }
  .icon { padding: 4px 7px; min-width: 30px; font-size: 15px; line-height: 1; }
  .icon svg { width: 15px; height: 15px; display: block; }
  .options { position: relative; }
  summary { cursor: pointer; }
  .options summary { list-style: none; }
  .options summary::-webkit-details-marker { display: none; }
  .options-menu {
    display: grid; gap: 3px; min-width: 150px; position: absolute; z-index: 4; right: 0;
    padding: 5px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow);
  }
  .options-menu button { text-align: left; }
  .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .stat-value { display: block; font-size: clamp(18px, 3vw, 25px); font-weight: 670; }
  .spend-grid { display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: 8px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 5px 2px; border-bottom: 1px solid var(--line); text-align: left; font-size: 13px; }
  th { color: var(--muted); font-weight: 550; }
  td:last-child, th:last-child { text-align: right; }
  .activity-grid { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 10px 14px; margin-top: 10px; }
  .weekdays, .heatmap { display: grid; grid-template-rows: repeat(7, 13px); gap: 4px; }
  .weekdays { color: var(--muted); font-size: 10px; line-height: 13px; }
  .heatmap { grid-auto-flow: column; grid-auto-columns: 13px; }
  .heatmap button { min-height: 0; padding: 0; border-radius: 2px; background: var(--green); border: 0; }
  .usage-scale { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .usage-scale i { width: 10px; height: 10px; border-radius: 2px; background: var(--green); }
  .chart { padding: 9px 10px 6px; background: var(--plot); border: 1px solid var(--line); border-radius: 8px; position: relative; min-width: 0; }
  .chart-head { min-height: 20px; margin-bottom: 4px; gap: 3px 8px; }
  .chart-head .row { gap: 5px; }
  .chart .info { padding: 0 5px; min-height: 20px; border-radius: 12px; }
  .chart :is(canvas, .empty-plot) { width: 100%; height: 122px; }
  .chart canvas { display: block; }
  .empty-plot { display: grid; place-items: center; text-align: center; }
  .chart [data-chart="weekly"] { height: 131px; }
  .quota-window .chart :is(canvas, .empty-plot) { height: 111px; }
  .quota-window .chart [data-chart="weekly"] { height: 128px; }
  .legend, .readout {
    position: absolute; top: 35px; left: 46px; max-width: calc(100% - 58px);
    z-index: 2; border: 1px solid var(--line); background: var(--surface); border-radius: 7px;
    padding: 6px 9px; box-shadow: var(--shadow); font-size: 12px; pointer-events: none;
  }
  .readout { inset: auto 12px 49px auto; }
  .swatch { display: inline-block; width: 9px; height: 9px; margin-right: 6px; border-radius: 2px; }
  .settings-list { display: grid; gap: 8px; }
  .setting { min-height: 30px; }
  .group > summary { padding: 6px 4px; font-weight: 650; }
  .group .stack { padding: 2px; }
  .screen-empty { text-align: center; padding: 28px 10px; }
  .banners .panel { box-shadow: var(--shadow); }
  .logs-window .notice { margin: 0; }
  .logs-window .notice p { margin-bottom: 0; }
  .toast {
    color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; box-shadow: var(--shadow); position: fixed; left: 50%; bottom: 18px;
    transform: translateX(-50%); max-width: calc(100% - 24px); z-index: 5;
  }
  dialog {
    max-width: min(450px, calc(100% - 24px)); width: 450px; background: var(--window);
    color: var(--text); border: 1px solid var(--line); padding: 17px; border-radius: 12px; box-shadow: var(--shadow);
  }
  dialog::backdrop { background: var(--scrim); }
  dialog label { display: grid; gap: 4px; }
  .sheet-footer { justify-content: flex-end; margin-top: 9px; }
  @media (max-width: 640px) {
    .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .spend-grid { grid-template-columns: 1fr; }
    .chart :is(canvas, .empty-plot) { height: 125px; }
  }
</style>
</head>
<body>
<header class="review">
  <div class="toolbar">
    <div class="review-copy"><strong>AI Fleet prototype</strong><small>Design review · Synthetic data</small></div>
    <label>Screen <select id="review-route"></select></label>
    <label>Fixture <select id="review-state" data-testid="review-state"></select></label>
    <label>Appearance <select id="review-theme" data-testid="review-theme"></select></label>
    <button id="reset">Reset demo</button>
  </div>
</header>
<main class="desktop">
  <div class="desktop-bar"><button data-route="providers"><span class="dot"></span>AI Fleet</button></div>
  <div id="stage" class="stage"></div>
</main>
<div hidden id="toast" role="status" class="toast"></div>
<dialog id="sheet"></dialog>
<script>
const screens = {
  providers: "Providers", agents: "Agents", processes: "Processes",
  quota: "Provider quota", statistics: "Token Spend", history: "Quota History",
  settings: "General", accounts: "Accounts", logs: "Logs", notifications: "Notifications"
};
const menuRoutes = ["providers", "agents", "processes"];
const shortcuts = { "⌃⌥F": "Control + Option + F", "⌃⇧F": "Control + Shift + F" };
const fixtures = {
  live: "Populated", empty: "Empty", stale: "Stale", error: "Error", loading: "Loading"
};
const themes = { dark: "Dark", light: "Light" };
const providers = {
  claude: { label: "Claude", models: ["Opus", "Sonnet"], color: "#db966a" },
  codex: { label: "Codex", models: ["GPT-6", "GPT-5.6"], color: "#6ed3d5" },
  kimi: { label: "Kimi", models: ["K2.6", "K2.5"], color: "#c695f4" },
  qwen: { label: "Qwen", models: ["Qwen Coder", "Qwen Max"], color: "#8d96ee" },
  grok: { label: "Grok", models: [] }, glm: { label: "GLM", models: [] },
  antigravity: { label: "Antigravity", models: [] }
};
const initialAccounts = [
  { id: "studio", name: "Studio", badge: "α", email: "studio@example.test", services: { codex: "connected", kimi: "connected", glm: "setup", qwen: "signin" } },
  { id: "personal", name: "Personal", badge: "β", email: "personal@example.test", services: { claude: "signin", grok: "signin" } },
  { id: "work", name: "Work", badge: "γ", email: "work@example.test", services: { claude: "connected", antigravity: "signin" } }
];
const quotaWindows = {
  claude: [{ name: "5h", used: 68, hours: 2.6 }, { name: "7d", used: 76, hours: 86 }, { name: "7d (Fable)", used: 100, hours: 86 }],
  codex: [{ name: "5h", used: 28, hours: 3.1 }, { name: "7d", used: 41, hours: 96 }],
  kimi: [{ name: "5h", used: 35, hours: 2.8 }, { name: "1m", used: 67, hours: 194 }]
};
const mockAgents = [
  { project: "AI Fleet", provider: "codex", heading: "Quota chart review", status: "Needs you", pane: "fleet:1.2", detail: "Are the four-hour labels readable at the minimum window width?" },
  { project: "AI Fleet", provider: "claude", heading: "Account fixture pass", status: "Working", pane: "fleet:1.3", detail: "Checking the sign-in and cancel states." },
  { project: "Mobile studio", provider: "claude", heading: "Accessibility review", status: "Needs you", pane: "studio:2.1", detail: "The review is ready. Should the empty view offer a setup shortcut?" },
  { project: "Mobile studio", provider: "kimi", heading: "Build summary", status: "Idle", pane: "studio:2.2", detail: "Last reply: the example build passed." },
  { project: "Sandbox", provider: "qwen", heading: "Local scratch session", status: "Unknown", pane: "", detail: "No current terminal binding." }
];
const mockProcesses = [
  { pid: 2841, provider: "codex", name: "codex", path: "AI Fleet", state: "Waiting", pane: "fleet:1.2", owner: "Interactive session" },
  { pid: 2902, provider: "claude", name: "claude", path: "AI Fleet", state: "Running", pane: "fleet:1.3", owner: "Interactive session" },
  { pid: 3154, provider: "kimi", name: "kimi", path: "Mobile studio", state: "Idle", pane: "studio:2.2", owner: "Interactive session" }
];
const mockIssues = [
  { provider: "claude", title: "Quota refresh", detail: "The latest quota request timed out. Last successful measurement is available.", tone: "warn" },
  { provider: "kimi", title: "Partial token accounting", detail: "A sample session has usage events without token counts.", tone: "warn" },
  { provider: "qwen", title: "Sign-in required", detail: "Connect a demo account to check provider limits.", tone: "warn" }
];
const url = new URL(location.href);
const routeParam = url.searchParams.get("screen");
const stateParam = url.searchParams.get("state");
const themeParam = url.searchParams.get("theme");
const defaults = () => ({
  accounts: structuredClone(initialAccounts), processes: structuredClone(mockProcesses),
  launch: { claude: "work", codex: "studio", kimi: "studio" },
  enabled: new Set(Object.keys(providers)), refresh: "5", notifications: true,
  closeOutside: true, hotkey: "⌃⌥F", active: true, agentFilter: "All",
  groupOpen: new Set(["AI Fleet"]), processFilter: "all", sort: "attention",
  scope: "all", logScope: "all", period: "30", accountPeriod: "30", provider: "claude", account: "work",
  tokens: "all", model: "all", agentsInPane: "", dismiss: new Set()
});
let data = defaults();
let route = Object.hasOwn(screens, routeParam) ? routeParam : "providers";
let fixture = Object.hasOwn(fixtures, stateParam) ? stateParam : "live";
let theme = Object.hasOwn(themes, themeParam) ? themeParam : (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
let refreshed = new Date();
let toastTimer;
let returnToLogs = "providers";
let sheetOrigin;
const stage = document.querySelector("#stage");
const sheet = document.querySelector("#sheet");
const $ = selector => document.querySelector(selector);
const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
})[char]);
const entries = object => Object.entries(object);
const selected = (current, option) => current === option ? " selected" : "";
const options = (object, current) => entries(object).map(([id, label]) =>
  '<option value="' + esc(id) + '"' + selected(current, id) + '>' + esc(label) + '</option>'
).join("");
const btn = (label, action, attrs = "") => '<button type="button" data-action="' + esc(action) + '" ' + attrs + '>' + label + '</button>';
const nav = (label, destination, attrs = "") => '<button type="button" data-route="' + destination + '" ' + attrs + '>' + label + '</button>';
const hook = id => 'data-testid="' + id + '"';
const choice = (id, object, current, test = id) =>
  '<select id="' + id + '" ' + hook(test) + '>' + options(object, current) + '</select>';
const fmt = new Intl.NumberFormat(undefined, { notation: "compact", maximumFractionDigits: 1 });
const time = new Intl.DateTimeFormat(undefined, { hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
const dateTime = new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
const zone = new Intl.DateTimeFormat(undefined, { timeZoneName: "short" }).formatToParts(new Date()).find(part => part.type === "timeZoneName")?.value;
const count = n => fmt.format(n);
const percent = n => n.toFixed(1) + "%";
const hour = 3600000;
const now = new Date();
now.setMinutes(0, 0, 0);
const times = Array.from({ length: 72 }, (_, index) => new Date(+now - (71 - index) * hour));
const series = Object.fromEntries(entries(providers).map(([id, provider], providerIndex) => [
  id, Object.fromEntries(provider.models.map((model, modelIndex) => [
    model, times.map((_, index) => {
      const work = (Math.sin(index * .52 + providerIndex + modelIndex) * .4 + .55) *
        (Math.cos(index * .26 - providerIndex) * .35 + .65);
      return (index + providerIndex + modelIndex) % 7 < 2 || index % 24 < 6 ? [0, 0, 0] : [
        Math.round(work * (providerIndex + 2) * 490000), Math.round(work * 12000000 / (modelIndex + 1)),
        Math.round(work * 330000)
      ];
    })
  ]))
]));
function connectionName(provider, account) {
  return providers[provider].label + (account ? " (" + account.badge + ")" : "");
}
function connectionLabel(provider, id) {
  return connectionName(provider, data.accounts.find(account => account.id === id));
}
function providerChoices() {
  return Object.fromEntries(entries(providers).filter(([id]) => data.enabled.has(id)).map(([id, value]) => [id, value.label]));
}
function analyticsProviders() {
  return Object.fromEntries(entries(providerChoices()).filter(([id]) => providers[id].models.length));
}
function showToast(message) {
  const toast = $("#toast");
  toast.textContent = message;
  toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.hidden = true; }, 3500);
}
function empty(title, detail) {
  return '<div class="panel screen-empty"><h2>' + title + '</h2><p class="muted">' + detail + '</p></div>';
}
function banner() {
  if (fixture === "error") return '<div class="notice"><strong>Refresh failed</strong><p class="muted">The example source could not be reached. ' + btn("Open Logs", "open-logs", hook("open-logs")) + '</p></div>';
  if (fixture === "stale") return '<div class="notice"><strong>Showing the last known data</strong><p class="muted">The example source has not refreshed recently.</p></div>';
  if (fixture === "loading") return '<div class="notice" role="status"><strong>Refreshing data…</strong><p class="muted">This fixture stays in the loading state until changed in Review.</p></div>';
  return "";
}
const chartIcon = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 2v12h12M4 10l3-3 3 1 4-4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function header(title, extra = "") {
  return '<header class="window-head"><h1>' + title + '</h1>' + extra + nav("×", "closed", 'class="icon ghost" aria-label="Close window"') + '</header>';
}
function tabs(items) {
  return '<nav class="tab-strip">' + items.map(([id, label, test]) =>
    nav(label, id, 'aria-pressed="' + (id === route) + '" ' + (test ? hook(test) : ""))
  ).join("") + '</nav>';
}
function renderMenu(content) {
  const actions = '<details class="options"><summary class="icon" aria-label="Options">•••</summary><div class="options-menu">' +
    nav("Statistics", "statistics") + nav("Settings", "settings") + btn("Logs", "open-logs", hook("open-logs")) +
    nav("Notifications", "notifications") + nav("Close menu", "closed") + '</div></details>';
  const status = '<span class="dot' + (data.active ? "" : " warn") + '"></span> ' + (data.active ? "Active" : "Paused");
  return header(status, btn("ⓘ", "fleet-status", 'class="icon ghost" aria-label="Fleet status"') +
    btn("↻", "refresh", 'class="icon ghost" aria-label="Refresh status"') + actions) +
    '<div class="window-body">' + tabs(menuRoutes.map(id => [id, screens[id]])) +
    banner() + content + '<footer class="row spread foot muted"><time>Last refresh · ' + time.format(refreshed) +
    '</time><span>AI Fleet</span></footer></div>';
}
function providersView() {
  if (fixture === "empty") return renderMenu(empty("No connected providers", "Add a provider in Accounts.") + nav("Open Accounts", "accounts"));
  if (fixture === "loading") return renderMenu("");
  const rows = data.accounts.flatMap(account => entries(account.services)
    .filter(([id]) => data.enabled.has(id)).map(([id, status]) => ({ account, id, status })));
  rows.sort((a, b) => Number(b.status === "connected") - Number(a.status === "connected"));
  return renderMenu(rows.length ? '<div class="provider-list">' + rows.map(({ account, id, status }) => {
    const label = connectionName(id, account);
    const readiness = fixture === "error" && status === "connected" ? "Quota unavailable" :
      (status === "connected" ? "Connected" : status === "setup" ? "Set up API key" : "Sign in required");
    const limits = status === "connected" && fixture !== "error" ? (quotaWindows[id] ?? []).map(window =>
      '<div class="quota-line mono"><span>' + window.name + '</span><strong>' + (100 - window.used) +
      '% left</strong><time>↻ ' + dateTime.format(+now + window.hours * hour) + '</time></div>'
    ).join("") : '<p class="muted">' + readiness + '</p>';
    const key = esc(id + "/" + account.id);
    return '<article class="provider-row"><div class="row"><strong>' +
      (data.launch[id] === account.id ? "→ " : "") + label + '</strong>' +
      btn("ⓘ", "provider-status", 'class="icon ghost" data-key="' + key + '" aria-label="' + label + ' status"') +
      (providers[id].models.length ? btn(chartIcon, "quota", 'class="icon ghost" data-key="' + key +
        '" aria-label="' + label + ' quota" ' + (id === "claude" && status === "connected" ? hook("quota-claude") : "")) : "") +
      '</div>' + limits + '</article>';
  }).join("") + '</div>' : empty("No visible providers", "Enable a provider in General or add one in Accounts."));
}
function agentsView() {

function providerMetrics() {

      const modelRows = entries(models).map(([model, samples], modelIndex) => {
        const sums = [0, 0, 0];
        const recent = new Map();
        samples.forEach((sample, index) => {
          const day = localDay(times[index]);
          const total = recent.get(day) ?? [0, 0, 0];
          recent.set(day, sample.map((value, part) => value + total[part]));
        });
        const seed = samples.slice(48).reduce((acc, sample) => acc.map((n, i) => n + sample[i]), [0, 0, 0]);
        for (let offset = 0; offset < days; offset++) {
          const date = new Date(now);
          date.setDate(now.getDate() - offset);
          const activity = .42 + .5 * ((Math.sin((offset + modelIndex + providerIndex * .5) * 1.1) + 1) / 2);
          const values = recent.get(localDay(date)) ?? seed.map(n => Math.round(n * activity));
          daily[offset] ??= { date, values: [0, 0, 0] };
          values.forEach((value, i) => { sums[i] += value; totals[i] += value; daily[offset].values[i] += value; });
        }

  const logs = '<div>' + btn("Open Logs", "open-logs", hook("open-logs") + ' data-value="' + provider + '"') + '</div>';
  if (status === "connected") {
    showDialog(label, fixture === "error" ? "Quota request failed. This account is still connected." :
      "This account is ready. The selection applies to the next launch.", "",
      data.launch[provider] === id ? "" : "Use next launch",
      data.launch[provider] === id ? null : () => {

        showToast(label + " selected for the next launch");
      }, false, logs + '<div>' + btn("Disconnect…", "disconnect", 'class="danger" data-key="' + provider + '/' + id + '"') + '</div>');
    return;
  }
  showDialog(label, status === "setup" ? "Use an example placeholder for the Coding Plan key." : "Preview the provider sign-in flow using the fixture.",
    status === "setup" ? '<label>Example key<input name="key" type="password" placeholder="Example only" required autocomplete="off"></label>' :
      '<label>Example result<select name="result"><option value="success">Signed in</option><option value="failure">Provider unavailable</option></select></label>',
    status === "setup" ? "Save example key" : "Simulate sign-in", values => {
      if (values.get("result") === "failure") {
        data.logScope = provider;
        showToast(label + " sign-in failed");
        return;
      }
      account.services[provider] = "connected";
      data.launch[provider] ??= id;
      render();
      showToast(label + " is connected");
    }, false, logs);
}
const actions = {

  "fleet-status": () => showDialog("Fleet status", data.active ? "The demo is observing example accounts and sessions." : "Status refresh is paused in the demo.", "",

    '<div>' + btn("Open Logs", "open-logs", hook("open-logs")) + '</div>'),
  "provider-status": control => connectionDialog(...control.dataset.key.split("/")),

  "agent-filter": control => { data.agentFilter = control.dataset.value; render(); },

  },
  jump: control => { data.agentsInPane = mockAgents[Number(control.dataset.value)].pane; showToast("Jumped to " + data.agentsInPane); },
  "process-detail": control => {

  },
  stop: stopProcess,
  "force-quit": stopProcess,
  "add-account": () => accountForm(),
  "edit-account": control => accountForm(data.accounts.find(account => account.id === control.dataset.value)),
  "remove-account": control => {
    const id = control.dataset.value;
    const account = data.accounts.find(row => row.id === id);
    showDialog("Remove " + esc(account.name) + "?", "This removes the example account and its connections from this demo.", "", "Remove", () => {
      data.accounts = data.accounts.filter(item => item.id !== id);

  },
  disconnect: control => {

    showDialog("Disconnect " + connectionName(provider, account) + "?", "The example connection returns to its setup state.", "", "Disconnect", () => {
      account.services[provider] = provider === "glm" ? "setup" : "signin";
      if (data.launch[provider] === id) delete data.launch[provider];
      render();
      showToast("Example connection disconnected");
    }, true);
  },
  cancel: () => sheet.close(),
  "open-logs": control => {
    if (sheet.open) sheet.close();
    if (route !== "logs") returnToLogs = route;
    data.logScope = control.dataset.value ?? "all";
    navigate("logs");
  },
  "dismiss-notice": control => { data.dismiss.add(control.dataset.value); render(); },
  "notification-open": control => {
    if (control.dataset.value === "quota") {
      selectConnection("claude", "work");

    } else {

      navigate("agents");
    }
  },
  "chart-legend": control => setLegend(control, control.getAttribute("aria-expanded") !== "true"),
  "activity-day": control => showToast(control.getAttribute("aria-label"))
};
function stopProcess(control) {
  const pid = Number(control.dataset.value);
  const row = data.processes.find(item => item.pid === pid);
  const force = control.dataset.action === "force-quit";
  showDialog((force ? "Force Quit" : "Stop") + " " + row.name + " · " + pid + "?",
    "Only this process in the example fixture will be removed.", "", force ? "Force Quit" : "Stop", () => {
      data.processes = data.processes.filter(item => item.pid !== pid);
      render();
      showToast("Example process " + pid + " stopped");
    }, true);
}
document.addEventListener("click", event => {
  const target = event.target.closest("button");
  if (!target) {
    if (menuRoutes.includes(route) && data.closeOutside && !event.target.closest(".window,.review,.desktop-bar,dialog")) {

  else if (target.dataset.action) actions[target.dataset.action]?.(target);

});
const changes = {
  "review-route": control => navigate(control.value),
  "review-state": control => { fixture = control.value; render(); },
  "review-theme": control => { theme = control.value; render(); },
  "quota-provider": control => selectConnection(control.value),
  "quota-account": control => { data.account = control.value; },
  "token-series": control => { data.tokens = control.value; },
  "token-model": control => { data.model = control.value; },
  "spend-provider": control => { data.scope = control.value; },
  "period-filter": control => { data.period = control.value; },
  "account-period": control => { data.accountPeriod = control.value; },
  "process-filter": control => { data.processFilter = control.value; },
  "process-sort": control => { data.sort = control.value; },
  "log-scope": control => { data.logScope = control.value; },

  "setting-outside": control => { data.closeOutside = control.checked; },
  "setting-notifications": control => { data.notifications = control.checked; },

};
document.addEventListener("change", event => {
  const control = event.target;
  const id = control.id;
  if (id.startsWith("enabled-")) {
    const provider = id.slice("enabled-".length);
    if (control.checked) data.enabled.add(provider);
    else data.enabled.delete(provider);
    if (!data.enabled.has(data.scope)) data.scope = "all";
    if (!data.enabled.has(data.provider)) {
      selectConnection(Object.keys(analyticsProviders())[0] ?? data.provider);
    }
  } else if (Object.hasOwn(changes, id)) {
    changes[id](control);
    if (id === "review-route" || id === "review-state" || id === "review-theme") return;
  } else return;
  render();
  document.getElementById(id)?.focus({ preventScroll: true });
});
stage.addEventListener("toggle", event => {
  const details = event.target;
  if (details.dataset.group && data.agentFilter === "All" && details.isConnected) {
    if (details.open) data.groupOpen.add(details.dataset.group);
    else data.groupOpen.delete(details.dataset.group);
  }
}, true);
function setLegend(control, visible) {
  control.setAttribute("aria-expanded", String(visible));
  control.closest(".chart").querySelector(".legend").hidden = !visible;
}
stage.addEventListener("pointerover", event => {
  const info = event.target.closest(".info");
  if (info) setLegend(info, true);
});
stage.addEventListener("pointerout", event => {
  const info = event.target.closest(".info");
  if (info && !info.contains(event.relatedTarget)) setLegend(info, false);
});
document.addEventListener("keydown", event => {
  if (event.code === "KeyF" && event.ctrlKey && !event.metaKey && !sheet.open) {
    const option = data.hotkey === "⌃⌥F";
    if (event.altKey === option && event.shiftKey !== option) {
      event.preventDefault();
      navigate(menuRoutes.includes(route) ? "closed" : "providers");
    }
  }
  if (event.key === "Escape" && !sheet.open) {
    const openOptions = stage.querySelector(".options[open]");
    if (openOptions) openOptions.open = false;
  }
});

function chartData(id) {
  const windows = limitsForSelection();
  const limit = windows.find(window => window.name === "7d");
  if (id === "tokens") {
    const parts = data.tokens === "all" ? components.map((_, index) => index) :
      [components.findIndex(part => part.id === data.tokens)];
    return { dates: times, points: observations(), parts };
  }
  if (id === "hourly") {
    const points = times.map((_, index) =>
      index < 47 ? null : ((index * 7 + Math.round(limit.used)) % 13 < 5 ? ((index % 6) + 1) / 6 : 0));
    return { dates: times, points, max:1, remainingPace: (100 - limit.used) / limit.hours };
  }
  const elapsed = 168 - limit.hours;
  const start = +now - elapsed * hour;
  const dates = Array.from({ length:169 }, (_, index) => new Date(start + index * hour));
  const latest = Math.floor(elapsed);
  const windowRate = limit.used / elapsed;
  const used = dates.map((_, i) => i > latest || i < latest - 26 ? null :
    i === latest ? limit.used : Math.max(0, Math.floor(limit.used - (latest - i) * windowRate * .75)));
  const dayRate = (limit.used - used[latest - 24]) / 24;
  const forecasts = fixture === "live" ? [
    { label: "Window average", rate: windowRate, color: "--amber", dash: [3, 5], phase: 0 },
    { label: "Trailing 24h", rate: dayRate, color: "--coral", dash: [1.5, 6.5], phase: 4 }
  ].map(forecast => {
    const duration = forecast.rate > 0 ? Math.min(limit.hours, (100 - limit.used) / forecast.rate) : limit.hours;
    const estimate = limit.used + forecast.rate * limit.hours;
    return { ...forecast, duration, estimate };
  }) : [];
  return {
    dates, used, max:100, latest, forecasts,
    budget: dates.map((_, i) => Math.min(100, (Math.floor(i / 24) + 1) * 100 / 7)),
  };
}
function drawPlot(canvas, probe = null) {
  const rect = canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const id = canvas.dataset.chart;
  const color = key => getComputedStyle(document.documentElement).getPropertyValue(key).trim();
  const scale = devicePixelRatio || 1;
  canvas.width = Math.round(rect.width * scale);
  canvas.height = Math.round(rect.height * scale);
  const g = canvas.getContext("2d");
  g.scale(scale, scale);
  const plot = { x:42, y:9, w:rect.width - 48, h:rect.height - (id === "weekly" ? 31 : 47) };
  if (plot.w <= 0) return;
  const data = chartData(id);
  const tokenMax = data.parts ? Math.max(1, ...data.points.map(point => data.parts.reduce((total, part) => total + point[part], 0))) : 0;
  const power = 10 ** Math.floor(Math.log10(Math.max(1, tokenMax / 4)));
  const tick = id === "weekly" ? 20 : id === "hourly" ? .2 : Math.ceil(tokenMax / (4 * power)) * power;
  const maximum = data.max ?? tick * 4;
  const x = i => plot.x + plot.w * i / (data.dates.length - 1);
  const y = value => plot.y + (1 - value / maximum) * plot.h;
  g.font = "11px system-ui";
  function line(x1, y1, x2, y2, stroke, dash = [], phase = 0) {
    g.strokeStyle = stroke;
    g.setLineDash(dash);
    g.lineDashOffset = phase;
    g.beginPath();
    g.moveTo(x1, y1);
    g.lineTo(x2, y2);
    g.stroke();
  }
  for (let i = 0; i <= Math.round(maximum / tick); i++) {
    const value = i * tick;
    line(plot.x, y(value), plot.x + plot.w, y(value), color("--grid"));
    if (!i) continue;
    g.fillStyle = color("--muted");
    g.textAlign = "right";
    g.fillText(id === "tokens" ? count(value) : percent(value), plot.x - 5, y(value) + 4);
  }
  const day = new Intl.DateTimeFormat(undefined, { month:"short", day:"numeric" });
  const pad = number => String(number).padStart(2, "0");
  const pixelsPerHour = plot.w / (data.dates.length - 1);
  const showMinutes = 6 * pixelsPerHour >= g.measureText("00:00").width + 4;
  for (let i = 0; i < data.dates.length; i++) {
    const date = data.dates[i];
    const isDaily = id === "weekly";
    if ((isDaily && i % 24 !== 12) || (!isDaily && date.getHours() % 6 !== 0)) continue;
    line(x(i), plot.y, x(i), plot.y + plot.h, color("--grid"));
    g.fillStyle = color("--muted");
    g.textAlign = "center";
    const labelX = Math.min(rect.width - 21, Math.max(22, x(i)));
    if (isDaily) {
      g.fillText(day.format(date), labelX, plot.y + plot.h + 16);
    } else {
      g.fillText(pad(date.getHours()) + (showMinutes ? ":00" : ""), labelX, plot.y + plot.h + 16);
      if (date.getHours() === 0) g.fillText(day.format(date), labelX, plot.y + plot.h + 32);
    }
  }
  g.save();
  g.beginPath();
  g.rect(plot.x, plot.y - 1, plot.w, plot.h + 1);
  g.clip();
  if (id === "weekly") {
    line(plot.x, y(100), plot.x + plot.w, y(100), color("--red"));
    function trace(values, stroke, width) {
      g.beginPath();
      g.strokeStyle = stroke;
      g.setLineDash([]);
      g.lineWidth = width;
      let previous = null;
      values.forEach((value, i) => {
        if (value === null) return;
        if (previous === null) g.moveTo(x(i), y(value));
        else {
          g.lineTo(x(i), y(previous));
          g.lineTo(x(i), y(value));
        }
        previous = value;
      });
      g.stroke();
    }
    g.save();
    g.globalAlpha = .65;
    trace(data.budget, color("--muted"), 1);
    g.restore();
    trace(data.used, color("--input"), 1.6);
    const current = data.used[data.latest];
    g.lineWidth = 1.2;
    for (const forecast of data.forecasts) {
      if (forecast.duration <= 0) continue;
      const endpoint = Math.min(100, current + forecast.duration * forecast.rate);
      line(x(data.latest), y(current), x(data.latest + forecast.duration), y(endpoint),
        color(forecast.color), forecast.dash, forecast.phase);
    }
  } else {
    const width = Math.max(2, plot.w / data.dates.length * .78);
    data.points.forEach((point, i) => {
      if (point === null) return;
      if (id === "hourly") {
        g.fillStyle = color("--green");
        g.fillRect(x(i) - width / 2, y(point), width, y(0) - y(point));
      } else {
        let used = 0;
        for (const index of data.parts) {
          g.fillStyle = color(components[index].color);
          g.fillRect(x(i) - width / 2, y(used + point[index]), width, y(used) - y(used + point[index]));
          used += point[index];
        }
      }
    });
    if (id === "hourly") line(plot.x, y(data.remainingPace), plot.x + plot.w, y(data.remainingPace), color("--amber"), [4, 3]);
  }
  const readout = canvas.nextElementSibling;
  if (probe !== null) {
    const i = Math.max(0, Math.min(data.dates.length - 1, probe));
    line(x(i), plot.y, x(i), plot.y + plot.h, color("--accent"), [3, 3]);
    const timeLabel = dateTime.format(data.dates[i]);
    let display;
    if (id === "tokens") {
      display = data.parts.map(index => components[index].label + " " + count(data.points[i][index])).join(" · ");
    } else if (id === "hourly") {
      display = data.points[i] === null ? "No measurement" : percent(data.points[i]);
    } else {
      const sinceLatest = i - data.latest;
      const projected = data.forecasts.filter(forecast => sinceLatest > 0 && sinceLatest <= forecast.duration)
        .map(forecast => forecast.label + " " + percent(data.used[data.latest] + sinceLatest * forecast.rate));
      const reading = data.used[i] !== null ? percent(data.used[i]) + " measured" : projected.join(" · ") || "No measurement";
      display = reading + " · Budget " + percent(data.budget[i]);
    }
    readout.textContent = timeLabel + " · " + display;
    readout.hidden = false;
  } else {
    readout.hidden = true;
  }
  g.restore();
}
function drawCharts() {
  stage.querySelectorAll("canvas[data-chart]").forEach(canvas => {
    let probe = null;
    drawPlot(canvas);
    canvas.addEventListener("pointermove", event => {
      const bounds = canvas.getBoundingClientRect();
      const samples = canvas.dataset.chart === "weekly" ? 168 : 71;
      probe = Math.round((event.clientX - bounds.left - 42) / (bounds.width - 48) * samples);
      drawPlot(canvas, probe);
    });
    canvas.addEventListener("pointerleave", () => { probe = null; drawPlot(canvas); });
    canvas.addEventListener("blur", () => { probe = null; drawPlot(canvas); });
    canvas.addEventListener("keydown", event => {
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      const max = canvas.dataset.chart === "weekly" ? 168 : 71;
      const step = event.key === "ArrowLeft" ? -1 : 1;
      probe = Math.min(max, Math.max(0, (probe ?? max) + step));
      drawPlot(canvas, probe);
      event.preventDefault();
    });
  });
}
const resize = new ResizeObserver(() => {
  stage.querySelectorAll("canvas[data-chart]").forEach(canvas => drawPlot(canvas));
});
resize.observe(stage);
render();
